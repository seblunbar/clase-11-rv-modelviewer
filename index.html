<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Feng Huang AR</title>
<meta name="viewport" content="width=device-width, initial-scale=0.25, maximum-scale=0.25, user-scalable=no" />
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>
<body>
 
<a-scene
  webxr="optionalFeatures: hit-test, local-floor, dom-overlay"
  xr-mode-ui="XRMode: ar">
<a-assets timeout="10000">
<a-asset-item id="eous" src="eous.glb"></a-asset-item>
<a-asset-item id="hollow" src="hollow.glb"></a-asset-item>
<a-asset-item id="miyaboo" src="miyaboo.glb"></a-asset-item>
<a-asset-item id="scp" src="scp.glb"></a-asset-item>
</a-assets>
 
  <a-entity
    gltf-model="#eous"
    animation-mixer="clip: *; loop: repeat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
    position="-10 -1.5 -10"
    scale="0.75 0.75 0.75"
    rotation="0 0 0">
<!-- animation-mixer = el aleteo de alas (viene dentro del modelo)
         animation       = EL GIRO que acabamos de agregar:
             · property: rotation  → anima la rotación
             · to: 0 360 0         → gira 360° sobre el eje Y (vertical, como un carrusel)
             · loop: true          → gira sin parar
             · dur: 10000          → tarda 10 segundos en dar una vuelta completa
             · easing: linear      → velocidad constante (sin acelerar ni frenar) -->
</a-entity>

   <a-entity
    gltf-model="#hollow"
    animation-mixer="clip: *; loop: repeat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
    position="10 -1.5 -10"
    scale="0.75 0.75 0.75"
    rotation="0 0 0">
<!-- animation-mixer = el aleteo de alas (viene dentro del modelo)
         animation       = EL GIRO que acabamos de agregar:
             · property: rotation  → anima la rotación
             · to: 0 360 0         → gira 360° sobre el eje Y (vertical, como un carrusel)
             · loop: true          → gira sin parar
             · dur: 10000          → tarda 10 segundos en dar una vuelta completa
             · easing: linear      → velocidad constante (sin acelerar ni frenar) -->
</a-entity>

   <a-entity
    gltf-model="#miyaboo"
    animation-mixer="clip: *; loop: repeat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
    position="10 -1.5 10"
    scale="0.75 0.75 0.75"
    rotation="0 0 0">
<!-- animation-mixer = el aleteo de alas (viene dentro del modelo)
         animation       = EL GIRO que acabamos de agregar:
             · property: rotation  → anima la rotación
             · to: 0 360 0         → gira 360° sobre el eje Y (vertical, como un carrusel)
             · loop: true          → gira sin parar
             · dur: 10000          → tarda 10 segundos en dar una vuelta completa
             · easing: linear      → velocidad constante (sin acelerar ni frenar) -->
</a-entity>

   <a-entity
    gltf-model="#scp"
    animation-mixer="clip: *; loop: repeat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
    position="-10 -1.5 10"
    scale="0.75 0.75 0.75"
    rotation="0 0 0">
<!-- animation-mixer = el aleteo de alas (viene dentro del modelo)
         animation       = EL GIRO que acabamos de agregar:
             · property: rotation  → anima la rotación
             · to: 0 360 0         → gira 360° sobre el eje Y (vertical, como un carrusel)
             · loop: true          → gira sin parar
             · dur: 10000          → tarda 10 segundos en dar una vuelta completa
             · easing: linear      → velocidad constante (sin acelerar ni frenar) -->
</a-entity>
 
  <a-light type="ambient" intensity="1.3"></a-light>
<a-light type="directional" intensity="1" position="1 3 2"></a-light>
<a-light type="directional" intensity="0.65" position="-1 3 -2"></a-light>
</a-scene>
</body>
</html>
